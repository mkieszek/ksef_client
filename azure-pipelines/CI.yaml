trigger:
  branches:
    include:
      - main
      - copilot/**
  pull_request:
    branches:
      - main

pool:
  name: 'proxmox-linux'

jobs:
  - job: test
    displayName: Lint and Tests (Compose Overlay)
    steps:
      - checkout: self
        clean: true
      - task: DockerInstaller@0
        displayName: 'Install Docker'
      - script: |
          docker compose -f compose/docker-compose.base.yml -f compose/docker-compose.test.yml up --abort-on-container-exit --build
        displayName: 'Compose up test overlay'
      - script: |
          docker compose -f compose/docker-compose.base.yml -f compose/docker-compose.test.yml logs --no-color || true
        displayName: 'Print Odoo logs on failure'
        condition: failed()
      - script: |
          docker compose -f compose/docker-compose.base.yml -f compose/docker-compose.test.yml down -v || true
        displayName: 'Tear down'
        condition: always()

  - job: build_prod
    displayName: Build Production Image
    dependsOn: test
    steps:
      - checkout: self
        clean: true
      - task: DockerInstaller@0
        displayName: 'Install Docker'
      - script: |
          docker build --target=prod -t ksef_client:prod -f docker/odoo/Dockerfile .
        displayName: 'Build prod image'
