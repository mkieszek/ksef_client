trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
      - bugfix/*

pool:
  name: 'proxmox-linux'

variables:
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '1.8.4'

steps:
  - checkout: self
    clean: true
  - task: UsePythonVersion@0
    displayName: 'Use Python $(PYTHON_VERSION)'
    inputs:
      versionSpec: '$(PYTHON_VERSION)'
      addToPath: true
  - script: |
      python -m pip install --upgrade pip
      pip install "poetry==\$(POETRY_VERSION)"
    displayName: 'Install Poetry'
  
  - script: |
      poetry config virtualenvs.create true
      poetry install --no-interaction --no-root
    displayName: 'Install dependencies with Poetry'
  
  - script: |
      poetry run ruff check .
    displayName: 'Run ruff (lint)'
  
  - script: |
      poetry run pytest
    displayName: 'Run pytest'
  
  # Jeśli chcesz odwzorować job `docker-compose-ci` z GitHub Actions:
  
  - task: DockerInstaller@0
    displayName: 'Install Docker (Azure agent)'
  
  - script: |
      docker version
      docker compose version || docker --version
    displayName: 'Check Docker on agent'
  
  - script: |
      docker compose -f compose/docker-compose.base.yml -f compose/docker-compose.test.yml up --abort-on-container-exit --build
    displayName: 'Run docker-compose test stack'
    env:
      # tu możesz dodać potrzebne zmienne środowiskowe dla testów
      PYTHONUNBUFFERED: '1'
