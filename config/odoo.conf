[options]
; Database settings
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Addons path - include the extra-addons directory where ksef_client will be mounted
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Logging
log_level = info
logfile = False

; Development settings
dev_mode = reload,qweb,werkzeug,xml

; Server settings
xmlrpc_port = 8069
